<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <title>Sudoku</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <span id="level"></span>
      <span id="status"></span>
      <button id="new-btn" class="text-btn">New</button>
    </header>

    <div id="board" role="grid" aria-label="Sudoku board"></div>

    <div id="actions">
      <button id="undo-btn">Undo</button>
      <button id="erase-btn">Erase</button>
      <button id="notes-btn" aria-pressed="false">Notes</button>
      <button id="cascade-btn" class="accent">Auto</button>
    </div>

    <div id="pad"></div>
  </main>

  <dialog id="new-dialog">
    <form method="dialog">
      <h2>New game</h2>
      <button value="easy">Easy</button>
      <button value="medium">Medium</button>
      <button value="hard">Hard</button>
      <button value="expert">Expert</button>
      <button value="" class="text-btn">Cancel</button>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="sudoku.js"></script>
  <script src="app.js"></script>
</body>
</html>
